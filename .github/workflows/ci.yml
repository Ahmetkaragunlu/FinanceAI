name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-jvm:
    name: Android JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      MAPS_API_KEY: ci-maps-placeholder
      AI_FIREBASE_PROJECT_ID: demo-financeai-ai-ci
      AI_FIREBASE_APP_ID: 1:1234567890:android:abcdef0123456789
      AI_FIREBASE_API_KEY: ci-ai-placeholder
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Ensure Android compile SDK
        run: '"$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0"'
      - name: Verify synthetic configuration safeguards
        run: node --test scripts/ci/prepare-android-config.test.cjs
      - name: Create synthetic client configuration
        run: node scripts/ci/prepare-android-config.cjs
      - name: Run JVM tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --console=plain

  functions-unit:
    name: Functions unit and syntax checks
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.25.0
          package_json_file: functions/package.json
          run_install: false
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Check syntax
        run: pnpm run check
      - name: Run backend unit tests
        run: pnpm test

# Instrumentation, Rules and SDK integration suites remain explicit local-emulator checks.
# This workflow has no credentials, deployment steps or application distribution artifacts.
